<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEB SLINGERS — Spider Beat 'Em Up</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f1c; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10;
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    color: #e8ecf5;
  }
  #healthWrap { width: 300px; }
  #healthLabel {
    font-size: 11px; letter-spacing: 4px; color: #ff8a8a; margin-bottom: 5px;
    text-shadow: 0 0 8px rgba(214,40,57,.8);
  }
  #healthBar {
    height: 14px; background: #1c202c; border: 1px solid #4a5164;
    border-radius: 3px; overflow: hidden;
  }
  #healthFill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #d62839, #ff5f5f);
    transition: width .15s;
  }
  #wave {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 18px; letter-spacing: 5px; color: #e8ecf5; z-index: 10; pointer-events: none;
  }
  #score {
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 24px; font-weight: 700; letter-spacing: 2px; text-align: right;
    text-shadow: 0 0 10px rgba(255,210,120,.5);
  }
  #combo {
    position: fixed; right: 18px; top: 62px;
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #ffd27a;
    opacity: 0; z-index: 10; pointer-events: none;
    text-shadow: 0 0 10px rgba(255,180,60,.7);
  }
  #hint {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 11px; letter-spacing: 2px; color: #8b93a8; opacity: .55;
    z-index: 10; pointer-events: none;
  }
  #banner {
    position: fixed; top: 28%; left: 0; width: 100%;
    text-align: center; z-index: 10; pointer-events: none; opacity: 0;
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
  }
  #banner .main { font-size: 54px; font-weight: 800; letter-spacing: 10px; color: #fff; text-shadow: 0 0 22px #d62839, 0 0 6px #fff; }
  #banner .sub { margin-top: 10px; font-size: 16px; letter-spacing: 6px; color: #ff9a9a; text-shadow: 0 0 12px #d62839; }
  #banner.show { animation: bannerAnim 2.4s ease-out forwards; }
  @keyframes bannerAnim {
    0%   { opacity: 0; transform: scale(.85); }
    14%  { opacity: 1; transform: scale(1.06); }
    26%  { transform: scale(1); }
    72%  { opacity: 1; }
    100% { opacity: 0; }
  }
  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(8,10,18,.78);
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    color: #e8ecf5; text-align: center;
  }
  #overlay h1 {
    font-size: 62px; font-weight: 800; letter-spacing: 12px;
    text-shadow: 0 0 28px rgba(214,40,57,.95), 0 0 8px rgba(255,255,255,.4);
  }
  #overlay .sub { margin-top: 8px; font-size: 14px; letter-spacing: 6px; color: #ff9a9a; }
  #overlay .lines { margin: 34px 0 30px; font-size: 15px; letter-spacing: 3px; line-height: 2.1; color: #b9c1d4; }
  #overlay .lines b { color: #ffd27a; font-weight: 700; }
  #overlay .footer {
    font-size: 17px; letter-spacing: 5px; color: #fff;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.3) 100%);
  }
  #flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 6;
    background: radial-gradient(ellipse at center, rgba(255,30,30,.12) 40%, rgba(255,20,20,.5) 100%);
    opacity: 0;
  }
  #diag {
    position: fixed; right: 10px; bottom: 42px; z-index: 40;
    font: 10px/1.4 monospace; letter-spacing: 1px; color: #7fd87f;
    background: rgba(0,0,0,.45); padding: 3px 6px; border-radius: 3px;
  }
</style>
</head>
<body>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="diag">BOOT</div>

  <div id="hud">
    <div id="healthWrap">
      <div id="healthLabel">SPIDER</div>
      <div id="healthBar"><div id="healthFill"></div></div>
    </div>
    <div id="score">000000</div>
  </div>
  <div id="wave">WAVE 1</div>
  <div id="combo"></div>
  <div id="hint">WASD MOVE &nbsp;·&nbsp; J PUNCH &nbsp;·&nbsp; K WEB SHOT &nbsp;·&nbsp; L / SHIFT DASH &nbsp;·&nbsp; P PAUSE</div>
  <div id="banner"></div>
  <div id="overlay">
    <h1 id="ovTitle">WEB SLINGERS</h1>
    <div class="sub" id="ovSub">A SPIDER BEAT 'EM UP</div>
    <div class="lines" id="ovLines"></div>
    <div class="footer" id="ovFooter">PRESS ENTER TO SWING</div>
  </div>

<script src="three.min.js"></script>
<script>
"use strict";

// ---------------------------------------------------------------- input
const keys = {};
let webglOk = true;
let frameCount = 0;
let diagTimer = 0;
const diagEl = document.getElementById("diag");
window.addEventListener("keydown", (e) => {
  const c = e.code;
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(c)) e.preventDefault();
  if (e.repeat) return;
  keys[c] = true;
  initAudio();
  if ((e.key === "Enter" || c === "Space") && (state === "menu" || state === "gameover")) { resetGame(); return; }
  if (state !== "playing") return;
  if (c === "KeyP") { paused = !paused; return; }
  if (paused) return;
  if (c === "KeyJ" || c === "KeyZ" || c === "Space") playerPunch();
  if (c === "KeyK" || c === "KeyX") playerWeb();
  if (c === "KeyL" || c === "KeyC" || c === "ShiftLeft" || c === "ShiftRight") playerDash();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
document.getElementById("overlay").addEventListener("pointerdown", () => {
  if (state === "menu" || state === "gameover") { initAudio(); resetGame(); }
});

// ---------------------------------------------------------------- setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2338);
scene.fog = new THREE.Fog(0x1a2338, 40, 110);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 5.6, 13);

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
} catch (err) {
  webglOk = false;
  const ov = document.getElementById("overlay");
  ov.querySelector("#ovTitle").textContent = "NO WEBGL";
  ov.querySelector("#ovSub").textContent = "WEBGL IS REQUIRED TO PLAY";
  ov.querySelector("#ovLines").innerHTML = "ENABLE HARDWARE ACCELERATION<br>OR TRY A DIFFERENT BROWSER";
  ov.querySelector("#ovFooter").textContent = "";
}
if (renderer) {
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);
  renderer.domElement.addEventListener("webglcontextlost", (e) => {
    e.preventDefault();
    diagEl.textContent = "WEBGL CONTEXT LOST";
    diagEl.style.color = "#ff6b6b";
  });
  diagEl.textContent = "WEBGL OK";
} else {
  diagEl.textContent = "WEBGL FAILED";
  diagEl.style.color = "#ff6b6b";
}

scene.add(new THREE.HemisphereLight(0x8a9bd0, 0x4a4234, 1.5));
scene.add(new THREE.AmbientLight(0x606a88, 0.7));
const moonlight = new THREE.DirectionalLight(0x9fb4ff, 1.1);
moonlight.position.set(-18, 35, -25);
moonlight.castShadow = true;
moonlight.shadow.mapSize.set(1024, 1024);
moonlight.shadow.camera.left = -25; moonlight.shadow.camera.right = 25;
moonlight.shadow.camera.top = 25; moonlight.shadow.camera.bottom = -25;
moonlight.shadow.camera.near = 1; moonlight.shadow.camera.far = 100;
scene.add(moonlight);
const stageLight = new THREE.DirectionalLight(0xffe2c0, 1.1);
stageLight.position.set(6, 9, 25);
scene.add(stageLight);
const playerLight = new THREE.PointLight(0xffd9a0, 1.6, 14);
scene.add(playerLight);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- textures
function makeGlowTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const ctx = c.getContext("2d");
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, "rgba(255,255,255,1)");
  g.addColorStop(0.3, "rgba(255,255,255,0.6)");
  g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTexture();

function makeStreetTexture() {
  const c = document.createElement("canvas"); c.width = 512; c.height = 1024;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#565e70"; ctx.fillRect(0, 0, 512, 1024);
  for (let i = 0; i < 2200; i++) {
    ctx.fillStyle = "rgba(200,205,220," + (Math.random() * 0.05).toFixed(3) + ")";
    ctx.fillRect(Math.random() * 512, Math.random() * 1024, 2, 2);
  }
  ctx.fillStyle = "#c8a437";
  for (let y = 16; y < 1024; y += 72) ctx.fillRect(250, y, 10, 38);
  ctx.fillStyle = "#7f8798";
  ctx.fillRect(26, 0, 6, 1024); ctx.fillRect(480, 0, 6, 1024);
  return new THREE.CanvasTexture(c);
}

function makeBuildingTexture() {
  const c = document.createElement("canvas"); c.width = 256; c.height = 512;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#2c3550"; ctx.fillRect(0, 0, 256, 512);
  const cols = 8, rows = 16, cw = 22, ch = 24;
  const ox = (256 - cols * cw) / 2, oy = 10;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const lit = Math.random() < 0.3;
    ctx.fillStyle = lit ? "rgba(255," + (190 + Math.random() * 50 | 0) + ",120," + (0.7 + Math.random() * 0.3).toFixed(2) + ")" : "#0b0e15";
    ctx.fillRect(ox + i * cw, oy + j * ch, 14, 14);
  }
  return new THREE.CanvasTexture(c);
}

// ---------------------------------------------------------------- city
function buildCity() {
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(14, 27),
    new THREE.MeshLambertMaterial({ map: makeStreetTexture() })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.z = -1;
  ground.receiveShadow = true;
  scene.add(ground);

  const swMat = new THREE.MeshLambertMaterial({ color: 0x3a4152 });
  for (const sx of [-1, 1]) {
    const sw = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.25, 27), swMat);
    sw.position.set(sx * 8.4, 0.125, -1);
    sw.receiveShadow = true;
    scene.add(sw);
  }

  const bt1 = makeBuildingTexture(), bt2 = makeBuildingTexture();
  for (let i = 0; i < 14; i++) {
    const sx = i % 2 === 0 ? -1 : 1;
    const w = 5 + Math.random() * 4;
    const d = 6 + Math.random() * 4;
    const h = 9 + Math.random() * 18;
    const b = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshLambertMaterial({ map: Math.random() < 0.5 ? bt1 : bt2 })
    );
    b.position.set(sx * (10 + w / 2 + Math.random() * 3), h / 2 - 0.05, -22 + (i >> 1) * 7 + Math.random() * 2);
    scene.add(b);
  }

  const poleMat = new THREE.MeshLambertMaterial({ color: 0x2a2f3c });
  const headMat = new THREE.MeshBasicMaterial({ color: 0xffd9a0 });
  for (const [x, z] of [[-5.4, -9], [5.4, -4], [-5.4, 2], [5.4, 8]]) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.1, 4.2, 6), poleMat);
    pole.position.set(x, 2.1, z); scene.add(pole);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 6), headMat);
    head.position.set(x, 4.3, z); scene.add(head);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffd9a0, transparent: true, opacity: 0.5, depthWrite: false }));
    glow.scale.setScalar(2.2); glow.position.copy(head.position); scene.add(glow);
  }

  const starGeo = new THREE.BufferGeometry();
  const pts = [];
  for (let i = 0; i < 500; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 120 + Math.random() * 60;
    pts.push(Math.cos(a) * r, 30 + Math.random() * 120, Math.sin(a) * r - 40);
  }
  starGeo.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xaabbff, size: 0.8, sizeAttenuation: true, fog: false, transparent: true, opacity: 0.8 })));

  const moon = new THREE.Mesh(new THREE.CircleGeometry(7, 32), new THREE.MeshBasicMaterial({ color: 0xdde4f2, fog: false }));
  moon.position.set(-45, 60, -120);
  moon.lookAt(0, 0, 0);
  scene.add(moon);
}
buildCity();

// ---------------------------------------------------------------- fighters
function buildFighter(colors, scale, opts) {
  opts = opts || {};
  const s = scale;
  const g = new THREE.Group();
  const mats = [];
  const bodyMat = new THREE.MeshLambertMaterial({ color: colors.body });
  const legMat = new THREE.MeshLambertMaterial({ color: colors.legs });
  const headMat = new THREE.MeshLambertMaterial({ color: colors.head || colors.body });
  mats.push(bodyMat, legMat, headMat);
  const glow = opts.emissive || 0.35;
  for (const m of mats) { m.emissive.copy(m.color).multiplyScalar(glow); m.userData.baseEmissive = m.emissive.clone(); }

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.56 * s, 0.62 * s, 0.32 * s), bodyMat);
  torso.position.y = 1.02 * s; torso.castShadow = true; g.add(torso);

  if (colors.emblem) {
    const emblem = new THREE.Mesh(new THREE.BoxGeometry(0.15 * s, 0.2 * s, 0.02), new THREE.MeshBasicMaterial({ color: 0x101018 }));
    emblem.position.set(0, 1.08 * s, 0.17 * s); g.add(emblem);
  }

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.34 * s, 0.36 * s, 0.34 * s), headMat);
  head.position.y = 1.5 * s; head.castShadow = true; g.add(head);

  if (colors.eyes) {
    const eyeMat = new THREE.MeshBasicMaterial({ color: colors.eyes });
    const e1 = new THREE.Mesh(new THREE.BoxGeometry(0.11 * s, 0.09 * s, 0.02), eyeMat);
    e1.position.set(-0.08 * s, 1.52 * s, 0.175 * s); g.add(e1);
    const e2 = e1.clone(); e2.position.x = 0.08 * s; g.add(e2);
  }

  const armGeo = new THREE.BoxGeometry(0.17 * s, 0.6 * s, 0.17 * s);
  const mkArm = (x) => {
    const a = new THREE.Group(); a.position.set(x, 1.3 * s, 0);
    const m = new THREE.Mesh(armGeo, bodyMat); m.position.y = -0.3 * s; m.castShadow = true; a.add(m);
    const glove = new THREE.Mesh(new THREE.BoxGeometry(0.19 * s, 0.16 * s, 0.19 * s), legMat);
    glove.position.y = -0.66 * s; a.add(glove);
    g.add(a); return a;
  };
  const armL = mkArm(-0.37 * s), armR = mkArm(0.37 * s);

  const legGeo = new THREE.BoxGeometry(0.2 * s, 0.68 * s, 0.22 * s);
  const mkLeg = (x) => {
    const a = new THREE.Group(); a.position.set(x, 0.7 * s, 0);
    const m = new THREE.Mesh(legGeo, legMat); m.position.y = -0.34 * s; m.castShadow = true; a.add(m);
    const boot = new THREE.Mesh(new THREE.BoxGeometry(0.22 * s, 0.12 * s, 0.3 * s), legMat);
    boot.position.set(0, -0.7 * s, 0.04 * s); a.add(boot);
    g.add(a); return a;
  };
  const legL = mkLeg(-0.16 * s), legR = mkLeg(0.16 * s);

  const tentGroups = [];
  if (opts.tentacles) {
    const tentMat = new THREE.MeshLambertMaterial({ color: 0x3a3f52 });
    mats.push(tentMat);
    for (const [sx] of [[-1], [1], [-1], [1]]) {
      const base = new THREE.Vector3(sx * 0.25, 1.3, -0.25).multiplyScalar(s);
      const pts = [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(sx * 0.45, 0.8, -0.65).multiplyScalar(s),
        new THREE.Vector3(sx * 0.7, 0.3, -1.45).multiplyScalar(s),
        new THREE.Vector3(sx * 0.65, -0.4, -2.05).multiplyScalar(s),
      ];
      const curve = new THREE.CatmullRomCurve3(pts);
      const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 10, 0.07 * s, 6, false), tentMat);
      mesh.castShadow = true;
      const tg = new THREE.Group();
      tg.position.copy(base);
      tg.add(mesh);
      g.add(tg);
      tentGroups.push(tg);
    }
  }

  return { group: g, torso, head, armL, armR, legL, legR, mats, tentGroups };
}

const _flashColor = new THREE.Color();
function flashChar(c, intensity, color) {
  const t = Math.min(1, intensity);
  _flashColor.setHex(color === undefined ? 0xffffff : color);
  for (const m of c.fighter.mats) {
    if (!m.userData.baseEmissive) { m.emissive.setHex(0x000000); continue; }
    if (t <= 0.01) m.emissive.copy(m.userData.baseEmissive);
    else m.emissive.copy(m.userData.baseEmissive).lerp(_flashColor, t * 0.85);
  }
}
function setCharOpacity(c, v) {
  for (const m of c.fighter.mats) { m.opacity = v; m.transparent = v < 1; }
}

// ---------------------------------------------------------------- state
const FIELD = { x: 6.2, zMin: -12.5, zMax: 10.5 };
function clampField(v) {
  v.x = Math.max(-FIELD.x, Math.min(FIELD.x, v.x));
  v.z = Math.max(FIELD.zMin, Math.min(FIELD.zMax, v.z));
}
function facingDir(a) { return new THREE.Vector3(Math.sin(a), 0, Math.cos(a)); }
function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

const player = {
  fighter: buildFighter({ body: 0xe03040, legs: 0x3358d8, head: 0xe03040, emblem: true, eyes: 0xffffff }, 1, { emissive: 0.5 }),
  pos: new THREE.Vector3(0, 0, 2),
  vel: new THREE.Vector3(),
  facing: 0,
  hp: 100, maxHp: 100,
  state: "idle", stateTime: 0,
  punchAlt: 0, punchHitDone: false,
  dashDir: new THREE.Vector3(0, 0, -1),
  invuln: 0, flashRed: 0, walkPhase: 0, dead: false,
};
scene.add(player.fighter.group);

const enemies = [];
const projectiles = [];
const orbs = [];
const particles = [];
const particleGeo = new THREE.BoxGeometry(0.07, 0.07, 0.07);

const ETYPES = {
  thug:    { hp: 4,  speed: 2.4, dmg: 8,  range: 1.35, windup: 0.45, scale: 1.0,  score: 100,  colors: { body: 0x6a7180, legs: 0x3a3f49, head: 0x54596a } },
  crawler: { hp: 4,  speed: 3.4, dmg: 6,  range: 1.2,  windup: 0.3,  scale: 0.85, score: 150,  colors: { body: 0x4f7a4a, legs: 0x2e4a33, head: 0x5d8a55, eyes: 0xffd24a } },
  brute:   { hp: 8,  speed: 1.8, dmg: 14, range: 1.7,  windup: 0.6,  scale: 1.28, score: 300,  colors: { body: 0x7a3fa0, legs: 0x4a2a6b, head: 0x8a4fb0 } },
  boss:    { hp: 24, speed: 2.0, dmg: 16, range: 1.8,  windup: 0.55, scale: 1.35, score: 1500, colors: { body: 0x2a2d3a, legs: 0x1d1f2a, head: 0x33364a, eyes: 0xffb32a }, tentacles: true },
};

let state = "menu"; // menu | playing | gameover
let paused = false;
let score = 0, wave = 0, combo = 0, comboTimer = 0;
let webCooldown = 0, dashCooldown = 0;
let spawnQueue = [], waveTime = 0, betweenWaves = 0;
let hitstop = 0, shake = 0, time = 0;

// ---------------------------------------------------------------- audio
let audioCtx = null;
function initAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function tone(type, f0, f1, dur, vol, when) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + (when || 0);
  const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  gn.gain.setValueAtTime(vol, t0);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn); gn.connect(audioCtx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  whoosh: () => tone("triangle", 480, 140, 0.09, 0.05),
  hit:    () => tone("square", 190, 60, 0.1, 0.14),
  down:   () => { tone("square", 420, 50, 0.28, 0.12); tone("triangle", 900, 200, 0.18, 0.06); },
  web:    () => tone("sawtooth", 260, 950, 0.13, 0.06),
  dash:   () => tone("triangle", 180, 720, 0.12, 0.06),
  hurt:   () => tone("sawtooth", 170, 45, 0.28, 0.16),
  pickup: () => tone("sine", 640, 1180, 0.14, 0.1),
  wave:   () => { tone("square", 520, 520, 0.1, 0.07); tone("square", 780, 780, 0.12, 0.07, 0.12); },
};

function moveInput() {
  const mx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const mz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  return { mx, mz };
}

// ---------------------------------------------------------------- player actions
function playerPunch() {
  const p = player;
  if (p.dead || p.state === "punch" || p.state === "dash" || p.state === "hit") return;
  p.state = "punch"; p.stateTime = 0; p.punchHitDone = false; p.punchAlt ^= 1;
}
function playerWeb() {
  const p = player;
  if (p.dead || p.state === "dash" || p.state === "punch") return;
  if (webCooldown > 0) return;
  webCooldown = 0.45;
  const dir = facingDir(p.facing);
  const pos = p.pos.clone().addScaledVector(dir, 0.5); pos.y = 1.1;
  spawnWeb(pos, dir, "player", 2);
  sfx.web();
}
function playerDash() {
  const p = player;
  if (p.dead || p.state === "dash" || dashCooldown > 0) return;
  const { mx, mz } = moveInput();
  let dir;
  if (mx || mz) dir = new THREE.Vector3(mx, 0, mz).normalize();
  else dir = facingDir(p.facing);
  p.dashDir = dir;
  p.facing = Math.atan2(dir.x, dir.z);
  p.state = "dash"; p.stateTime = 0; p.invuln = 0.3;
  dashCooldown = 1.1;
  sfx.dash();
}

// ---------------------------------------------------------------- combat
function spawnBurst(x, y, z, color, n) {
  for (let i = 0; i < n && particles.length < 80; i++) {
    const m = new THREE.Mesh(particleGeo, new THREE.MeshBasicMaterial({ color }));
    m.position.set(x, y, z);
    scene.add(m);
    const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 3;
    particles.push({ mesh: m, vel: new THREE.Vector3(Math.cos(a) * s, 1.5 + Math.random() * 2, Math.sin(a) * s), t: 0, life: 0.5 + Math.random() * 0.3 });
  }
}
function hitstop_(d) { hitstop = Math.max(hitstop, d); }

function hitEnemy(e, dir, dmg, knock, stun) {
  if (e.state === "dead") return;
  e.hp -= dmg;
  e.flash = 1;
  e.vel.addScaledVector(dir, knock);
  spawnBurst(e.pos.x, 1.1, e.pos.z, e.type === "boss" ? 0x88aaff : 0xffd27a, 8);
  hitstop_(0.05);
  sfx.hit();
  if (e.hp <= 0) {
    e.state = "dead"; e.stateTime = 0; e.removed = false; e.fadeT = 0;
    combo++; comboTimer = 1.6;
    score += Math.round(e.score * (1 + Math.min(combo, 20) * 0.1));
    sfx.down();
    shake = Math.max(shake, 0.2);
    if (Math.random() < 0.12) spawnOrb(e.pos);
  } else {
    e.state = "hit"; e.stateTime = 0; e.stunDur = stun;
  }
}

function hitPlayer(dmg, fromDir) {
  if (player.invuln > 0 || player.state === "dash" || player.dead) return;
  player.hp -= dmg;
  player.invuln = 0.9;
  player.flashRed = 0.55;
  player.vel.addScaledVector(fromDir, 6);
  player.state = "hit"; player.stateTime = 0;
  shake = Math.max(shake, 0.35);
  hitstop_(0.07);
  sfx.hurt();
  if (player.hp <= 0) {
    player.hp = 0;
    player.dead = true;
    player.state = "dead"; player.stateTime = 0;
  }
}

function spawnWeb(pos, dir, owner, dmg) {
  const color = owner === "player" ? 0xf5f7ff : 0xcfd6ff;
  const grp = new THREE.Group();
  const core = new THREE.Mesh(new THREE.SphereGeometry(owner === "player" ? 0.09 : 0.16, 8, 6), new THREE.MeshBasicMaterial({ color }));
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity: 0.8, depthWrite: false }));
  glow.scale.setScalar(owner === "player" ? 0.7 : 1.1);
  grp.add(core, glow);
  scene.add(grp);
  projectiles.push({
    pos: pos.clone(),
    vel: dir.clone().normalize().multiplyScalar(owner === "player" ? 13 : 8),
    life: 2, mesh: grp, owner, dmg: dmg || 2,
  });
}

function spawnOrb(pos) {
  const grp = new THREE.Group();
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), new THREE.MeshBasicMaterial({ color: 0x7dff9a }));
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x7dff9a, transparent: true, opacity: 0.7, depthWrite: false }));
  glow.scale.setScalar(1.1);
  grp.add(core, glow);
  grp.position.set(pos.x, 0.5, pos.z);
  scene.add(grp);
  orbs.push({ grp, t: 0, life: 12 });
}

function nearestEnemy(pos, maxDist) {
  let best = null, bd = maxDist;
  for (const e of enemies) {
    if (e.state === "dead") continue;
    const d = pos.distanceTo(e.pos);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

// ---------------------------------------------------------------- waves
function spawnEnemy(type) {
  const T = ETYPES[type];
  const f = buildFighter(T.colors, T.scale, { tentacles: T.tentacles });
  const e = {
    type, fighter: f,
    pos: new THREE.Vector3((Math.random() * 2 - 1) * 5.5, 0, -13.5 - Math.random() * 2),
    vel: new THREE.Vector3(), facing: 0,
    hp: T.hp, maxHp: T.hp,
    state: "chase", stateTime: Math.random() * 0.3,
    atkCd: 0.8 + Math.random(), hitDone: false,
    speed: T.speed, dmg: T.dmg, attackRange: T.range, windupDur: T.windup,
    score: T.score, flash: 0, phase: Math.random() * 6, walking: false, stunDur: 0,
  };
  scene.add(f.group);
  enemies.push(e);
  if (type === "boss") { e.webTimer = 3; banner("DR. OCTAVIUS", "BOSS"); }
}

function startWave(n) {
  wave = n; waveTime = 0;
  const boss = n % 5 === 0;
  banner("WAVE " + n, boss ? "DR. OCTAVIUS APPEARS" : "");
  const count = Math.min(4 + (n - 1) * 2, 14);
  spawnQueue = [];
  for (let i = 0; i < count; i++) {
    let type = "thug";
    if (boss && i === 0) type = "boss";
    else {
      const r = Math.random();
      const bruteChance = n >= 2 ? Math.min(0.08 + (n - 2) * 0.03, 0.3) : 0;
      const crawlerChance = n >= 3 ? Math.min(0.12 + (n - 3) * 0.02, 0.25) : 0;
      if (r < bruteChance) type = "brute";
      else if (r < bruteChance + crawlerChance) type = "crawler";
    }
    spawnQueue.push({ type, at: 1.0 + i * 0.55 + Math.random() * 0.25 });
  }
  sfx.wave();
}

function waveLogic(dt) {
  if (player.dead) return;
  if (spawnQueue.length) {
    waveTime += dt;
    while (spawnQueue.length && spawnQueue[0].at <= waveTime) spawnEnemy(spawnQueue.shift().type);
  } else if (enemies.length === 0) {
    if (betweenWaves === 0) {
      betweenWaves = 2.6;
      score += wave * 100;
      banner("WAVE CLEAR", "+" + wave * 100);
      sfx.wave();
    }
  }
  if (betweenWaves > 0) {
    betweenWaves -= dt;
    if (betweenWaves <= 0) { betweenWaves = 0; startWave(wave + 1); }
  }
}

// ---------------------------------------------------------------- updates
function updatePlayer(dt) {
  const p = player;
  p.stateTime += dt;
  p.invuln = Math.max(0, p.invuln - dt);
  p.flashRed = Math.max(0, p.flashRed - dt * 1.6);
  p.vel.multiplyScalar(Math.max(0, 1 - 5 * dt));
  p.pos.addScaledVector(p.vel, dt);
  clampField(p.pos);

  if (p.dead) {
    p.fighter.group.rotation.x = -Math.min(1, p.stateTime / 0.6) * Math.PI / 2;
    if (p.stateTime > 1.5 && state === "playing") {
      state = "gameover";
      showOverlay("GAME OVER", "THE CITY NEEDS YOU",
        "<b>SCORE</b> &nbsp;" + String(score).padStart(6, "0") + "<br><b>WAVE REACHED</b> &nbsp;" + wave,
        "PRESS ENTER TO RETRY");
    }
    p.fighter.group.position.copy(p.pos);
    return;
  }

  const { mx, mz } = moveInput();
  const moving = mx || mz;

  if (p.state === "idle" || p.state === "walk") {
    if (moving) {
      const speed = 4.6;
      p.pos.x += mx * speed * dt;
      p.pos.z += mz * speed * dt;
      clampField(p.pos);
      p.facing = lerpAngle(p.facing, Math.atan2(mx, mz), 1 - Math.exp(-14 * dt));
      p.state = "walk";
    } else {
      p.state = "idle";
      const e = nearestEnemy(p.pos, 4);
      if (e) p.facing = lerpAngle(p.facing, Math.atan2(e.pos.x - p.pos.x, e.pos.z - p.pos.z), 1 - Math.exp(-4 * dt));
    }
  } else if (p.state === "punch") {
    if (!p.punchHitDone && p.stateTime > 0.04 && p.stateTime < 0.14) {
      p.punchHitDone = true;
      const dir = facingDir(p.facing);
      let hitAny = false;
      for (const e of enemies) {
        if (e.state === "dead") continue;
        const d = new THREE.Vector3().subVectors(e.pos, p.pos);
        const dist = d.length();
        if (dist < 1.4 && d.normalize().dot(dir) > 0.25) { hitEnemy(e, dir, 2, 4.5, 0.35); hitAny = true; }
      }
      if (!hitAny) sfx.whoosh();
    }
    if (p.stateTime > 0.24) p.state = "idle";
  } else if (p.state === "dash") {
    p.pos.addScaledVector(p.dashDir, 11 * dt);
    clampField(p.pos);
    if (p.stateTime > 0.2) p.state = "idle";
  } else if (p.state === "hit") {
    if (p.stateTime > 0.32) p.state = "idle";
  }

  p.fighter.group.position.copy(p.pos);
  p.fighter.group.rotation.y = p.facing;
  animatePlayer(dt);
}

function animatePlayer(dt) {
  const f = player.fighter, p = player;
  if (p.dead) return;
  let legA = 0, armL = -0.12, armR = -0.12, torsoX = 0;
  if (p.state === "walk") {
    p.walkPhase += dt * 11;
    legA = Math.sin(p.walkPhase) * 0.55;
    armL = -legA * 0.6; armR = legA * 0.6;
    f.group.position.y = Math.abs(Math.sin(p.walkPhase)) * 0.05;
  } else if (p.state === "idle") {
    f.group.position.y = Math.sin(time * 3.2) * 0.015;
  } else if (p.state === "punch") {
    const t = Math.min(1, p.stateTime / 0.24);
    const ext = Math.sin(t * Math.PI);
    const punchArm = p.punchAlt ? f.armR : f.armL;
    const guardArm = p.punchAlt ? f.armL : f.armR;
    punchArm.rotation.x = -ext * 1.7;
    guardArm.rotation.x = -0.7 - ext * 0.2;
    torsoX = ext * 0.22;
  } else if (p.state === "dash") {
    legA = 0.8; armL = -1.1; armR = -1.1; torsoX = 0.35;
  } else if (p.state === "hit") {
    torsoX = -0.35; armL = 0.4; armR = 0.4;
  }
  f.legL.rotation.x = legA; f.legR.rotation.x = -legA;
  f.armL.rotation.x = armL; f.armR.rotation.x = armR;
  f.torso.rotation.x = torsoX;
  f.head.rotation.x = torsoX * 0.5;
  flashChar(p, p.flashRed, 0xff3322);
  if (p.invuln > 0 && p.state !== "dash") {
    f.group.visible = Math.floor(time * 16) % 2 === 0;
  } else f.group.visible = true;
}

function bossAI(e, dt, dist, dirP) {
  e.webTimer -= dt;
  if (e.webTimer <= 0 && dist > 3 && !player.dead) {
    e.webTimer = 3.5 + Math.random() * 1.5;
    const pos = e.pos.clone(); pos.y = 1.4;
    const dir = dirP.clone(); dir.y = 0.03; dir.normalize();
    spawnWeb(pos, dir, "enemy", 10);
    sfx.web();
  }
  e.fighter.tentGroups.forEach((tg, i) => { tg.rotation.z = Math.sin(time * 1.6 + i * 1.4) * 0.12; });
}

function updateEnemies(dt) {
  for (const e of enemies) {
    e.stateTime += dt;
    e.flash = Math.max(0, e.flash - dt * 3);
    e.vel.multiplyScalar(Math.max(0, 1 - 5 * dt));
    e.pos.addScaledVector(e.vel, dt);
    clampField(e.pos);

    const toP = new THREE.Vector3().subVectors(player.pos, e.pos);
    const dist = toP.length();
    const dirP = toP.clone().normalize();

    if (e.state !== "dead" && !player.dead) {
      e.facing = lerpAngle(e.facing, Math.atan2(dirP.x, dirP.z), 1 - Math.exp(-10 * dt));
    }

    switch (e.state) {
      case "chase": {
        if (player.dead) { e.walking = false; break; }
        e.atkCd -= dt;
        if (dist > e.attackRange * 0.95) {
          e.pos.addScaledVector(dirP, e.speed * dt);
          e.walking = true;
          e.phase += dt * e.speed * 2.2;
        } else e.walking = false;
        for (const o of enemies) {
          if (o === e || o.state === "dead") continue;
          const d = new THREE.Vector3().subVectors(e.pos, o.pos);
          const dd = d.length();
          if (dd < 1.0 && dd > 0.001) e.pos.addScaledVector(d.normalize(), (1.0 - dd) * 6 * dt);
        }
        const dp = new THREE.Vector3().subVectors(e.pos, player.pos);
        if (dp.length() < 0.75 && dp.length() > 0.001) e.pos.addScaledVector(dp.normalize(), (0.75 - dp.length()) * 4 * dt);
        if (e.atkCd <= 0 && dist < e.attackRange + 0.1) { e.state = "windup"; e.stateTime = 0; }
        if (e.type === "boss") bossAI(e, dt, dist, dirP);
        break;
      }
      case "windup":
        if (e.stateTime >= e.windupDur) { e.state = "attack"; e.stateTime = 0; e.hitDone = false; }
        break;
      case "attack":
        if (!e.hitDone && e.stateTime >= 0.08 && e.stateTime <= 0.2) {
          e.hitDone = true;
          if (dist < e.attackRange + 0.3) hitPlayer(e.dmg, dirP);
          else sfx.whoosh();
        }
        if (e.stateTime > 0.32) { e.state = "chase"; e.stateTime = 0; e.atkCd = 0.9 + Math.random(); }
        break;
      case "hit":
        if (e.stateTime > e.stunDur) { e.state = "chase"; e.stateTime = 0; }
        break;
      case "dead":
        break;
    }

    e.fighter.group.position.copy(e.pos);
    e.fighter.group.rotation.y = e.facing;
    if (e.flash > 0) flashChar(e, e.flash);
    else if (e.state === "windup") flashChar(e, 0.4, 0xff5533);
    else flashChar(e, 0);
    animateEnemy(e, dt);

    if (e.state === "dead") {
      e.fighter.group.rotation.x = -Math.min(1, e.stateTime / 0.5) * Math.PI / 2;
      if (e.stateTime > 0.8) {
        e.fadeT += dt;
        setCharOpacity(e, Math.max(0, 1 - e.fadeT / 0.7));
        if (e.fadeT > 0.7 && !e.removed) { e.removed = true; scene.remove(e.fighter.group); }
      }
    }
  }
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].removed) enemies.splice(i, 1);
}

function animateEnemy(e, dt) {
  const f = e.fighter;
  if (e.state === "dead") return;
  let legA = 0, armL = -0.12, armR = -0.12, torsoX = 0;
  if (e.state === "chase" && e.walking) legA = Math.sin(e.phase) * 0.55;
  if (e.state === "windup") {
    const t = Math.min(1, e.stateTime / e.windupDur);
    armL = -1.2 * t; armR = -1.2 * t; torsoX = -0.15 * t;
  } else if (e.state === "attack") {
    const t = Math.min(1, e.stateTime / 0.32);
    if (t < 0.3) { const s = t / 0.3; armR = -1.2 + s * 1.5; torsoX = 0.25 * s; }
    else { armR = 0.3 - (t - 0.3) * 0.5; torsoX = 0.25 * (1 - t); }
    armL = -0.5;
  } else if (e.state === "hit") {
    torsoX = -0.4; armL = 0.5; armR = 0.5;
  }
  f.legL.rotation.x = legA; f.legR.rotation.x = -legA;
  f.armL.rotation.x = armL; f.armR.rotation.x = armR;
  f.torso.rotation.x = torsoX;
  f.head.rotation.x = torsoX * 0.6;
  f.group.position.y = e.walking ? Math.abs(Math.sin(e.phase)) * 0.05 : Math.sin(time * 3 + e.phase) * 0.015;
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const w = projectiles[i];
    w.life -= dt;
    w.pos.addScaledVector(w.vel, dt);
    w.mesh.position.copy(w.pos);
    let dead = w.life <= 0 || w.pos.z < -15 || w.pos.z > 14 || Math.abs(w.pos.x) > 9;
    if (!dead && w.owner === "player") {
      for (const e of enemies) {
        if (e.state === "dead") continue;
        if (e.pos.distanceTo(w.pos) < 0.65) {
          hitEnemy(e, w.vel.clone().normalize(), 2, 6, 0.55);
          dead = true;
          break;
        }
      }
    } else if (!dead && w.owner === "enemy") {
      const dx = w.pos.x - player.pos.x, dz = w.pos.z - player.pos.z;
      if (Math.sqrt(dx * dx + dz * dz) < 0.8 && !player.dead) {
        hitPlayer(w.dmg, w.vel.clone().normalize());
        dead = true;
      }
    }
    if (dead) { scene.remove(w.mesh); projectiles.splice(i, 1); }
  }
}

function updateOrbs(dt) {
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.t += dt; o.life -= dt;
    o.grp.position.y = 0.5 + Math.sin(o.t * 3) * 0.1;
    o.grp.rotation.y += dt * 2;
    let dead = o.life <= 0;
    if (!dead && !player.dead && o.grp.position.distanceTo(player.pos) < 0.9) {
      player.hp = Math.min(player.maxHp, player.hp + 20);
      sfx.pickup();
      spawnBurst(player.pos.x, 1, player.pos.z, 0x7dff9a, 6);
      dead = true;
    }
    if (dead) { scene.remove(o.grp); orbs.splice(i, 1); }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t > p.life) { scene.remove(p.mesh); particles.splice(i, 1); continue; }
    p.vel.y -= 9 * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.scale.setScalar(Math.max(0.05, 1 - p.t / p.life));
    p.mesh.rotation.x += dt * 8; p.mesh.rotation.y += dt * 6;
  }
}

function updateCamera(rdt) {
  const desired = new THREE.Vector3(player.pos.x, 5.6, player.pos.z + 10.6);
  camera.position.lerp(desired, 1 - Math.exp(-5 * rdt));
  shake *= Math.exp(-6 * rdt);
  if (shake > 0.001) {
    camera.position.x += (Math.random() - 0.5) * shake;
    camera.position.y += (Math.random() - 0.5) * shake;
  }
  camera.lookAt(player.pos.x, 1.2, player.pos.z);
  playerLight.position.set(player.pos.x, 2.2, player.pos.z);
}

// ---------------------------------------------------------------- HUD
const healthFill = document.getElementById("healthFill");
const scoreEl = document.getElementById("score");
const waveEl = document.getElementById("wave");
const comboEl = document.getElementById("combo");
const flashEl = document.getElementById("flash");
const bannerEl = document.getElementById("banner");
const overlay = document.getElementById("overlay");
const ovTitle = document.getElementById("ovTitle");
const ovSub = document.getElementById("ovSub");
const ovLines = document.getElementById("ovLines");
const ovFooter = document.getElementById("ovFooter");

function banner(main, sub) {
  bannerEl.innerHTML = '<div class="main">' + main + "</div>" + (sub ? '<div class="sub">' + sub + "</div>" : "");
  bannerEl.classList.remove("show");
  void bannerEl.offsetWidth;
  bannerEl.classList.add("show");
}
function showOverlay(title, sub, lines, footer) {
  ovTitle.textContent = title;
  ovSub.textContent = sub || "";
  ovLines.innerHTML = lines || "";
  ovFooter.textContent = footer || "";
  overlay.style.display = "flex";
}
function hideOverlay() { overlay.style.display = "none"; }

function updateHUD() {
  healthFill.style.width = (player.hp / player.maxHp * 100) + "%";
  healthFill.style.background = player.hp < 30
    ? "linear-gradient(90deg,#ff2a2a,#ff6a4a)"
    : "linear-gradient(90deg,#d62839,#ff5f5f)";
  scoreEl.textContent = String(score).padStart(6, "0");
  waveEl.textContent = "WAVE " + wave;
  if (combo >= 2 && comboTimer > 0) { comboEl.textContent = "COMBO ×" + combo; comboEl.style.opacity = 1; }
  else comboEl.style.opacity = 0;
  flashEl.style.opacity = player.flashRed;
}

// ---------------------------------------------------------------- flow
function resetGame() {
  for (const e of enemies) scene.remove(e.fighter.group);
  enemies.length = 0;
  for (const w of projectiles) scene.remove(w.mesh);
  projectiles.length = 0;
  for (const o of orbs) scene.remove(o.grp);
  orbs.length = 0;
  for (const p of particles) scene.remove(p.mesh);
  particles.length = 0;
  score = 0; combo = 0; comboTimer = 0; wave = 0;
  spawnQueue = []; waveTime = 0; betweenWaves = 0;
  hitstop = 0; shake = 0;
  const p = player;
  p.hp = p.maxHp; p.dead = false; p.state = "idle"; p.stateTime = 0;
  p.pos.set(0, 0, 2); p.vel.set(0, 0, 0); p.facing = 0;
  p.invuln = 0; p.flashRed = 0;
  p.fighter.group.rotation.x = 0;
  setCharOpacity(p, 1);
  flashChar(p, 0);
  hideOverlay();
  state = "playing";
  startWave(1);
}

showOverlay("WEB SLINGERS", "A SPIDER BEAT 'EM UP",
  "<b>MOVE</b> &nbsp;WASD / ARROWS<br>" +
  "<b>PUNCH</b> &nbsp;J<br>" +
  "<b>WEB SHOT</b> &nbsp;K<br>" +
  "<b>WEB DASH</b> &nbsp;L / SHIFT<br>" +
  "<b>PAUSE</b> &nbsp;P",
  "PRESS ENTER TO SWING");

// ---------------------------------------------------------------- loop
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const rdt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (!paused) {
    let dt = rdt;
    if (hitstop > 0) { hitstop -= rdt; dt = rdt * 0.15; }
    time += dt;

    if (state === "playing") {
      updatePlayer(dt);
      updateEnemies(dt);
      updateProjectiles(dt);
      updateOrbs(dt);
      updateParticles(dt);
      waveLogic(dt);
      comboTimer = Math.max(0, comboTimer - dt);
      webCooldown = Math.max(0, webCooldown - dt);
      dashCooldown = Math.max(0, dashCooldown - dt);
    } else if (state === "menu") {
      player.fighter.group.position.copy(player.pos);
      player.fighter.group.rotation.y = Math.sin(time * 0.4) * 0.5;
      animatePlayer(dt);
      updateParticles(dt);
    } else {
      updateParticles(dt);
    }
    updateCamera(rdt);
  }
  updateHUD();
  if (renderer) renderer.render(scene, camera);
  frameCount++;
  diagTimer += rdt;
  if (diagTimer >= 0.5) {
    diagTimer = 0;
    const fps = Math.round(frameCount / 0.5);
    frameCount = 0;
    if (renderer && webglOk) diagEl.textContent = "WEBGL OK · " + fps + " FPS";
  }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
